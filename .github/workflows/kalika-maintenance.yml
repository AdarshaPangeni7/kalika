name: Kalika maintenance checks

on:
  schedule:
    - cron: "17 2 * * *"
    - cron: "37 3 * * 1"
    - cron: "7 4 1 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Which checks to run"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - weekly
          - monthly
          - all

permissions:
  contents: read

concurrency:
  group: kalika-maintenance
  cancel-in-progress: false

jobs:
  site-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install checker dependencies
        run: npm ci

      - name: Install browser for console checks
        if: github.event.inputs.mode == 'weekly' || github.event.inputs.mode == 'all' || github.event.schedule == '37 3 * * 1'
        run: npx playwright install --with-deps chromium

      - name: Choose scheduled check mode
        id: mode
        shell: bash
        run: |
          mode="${{ github.event.inputs.mode }}"
          if [ -z "$mode" ]; then
            case "${{ github.event.schedule }}" in
              "37 3 * * 1") mode="weekly" ;;
              "7 4 1 * *") mode="monthly" ;;
              *) mode="daily" ;;
            esac
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Run read-only Kalika checks
        id: run_checks
        continue-on-error: true
        env:
          KALIKA_SITE_ORIGIN: ${{ vars.KALIKA_SITE_ORIGIN || 'https://kalikatools.com' }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          GSC_PROPERTY: ${{ vars.GSC_PROPERTY || 'https://kalikatools.com/' }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          KALIKA_PERFORMANCE_MIN: ${{ vars.KALIKA_PERFORMANCE_MIN || '80' }}
        run: npm run check:${{ steps.mode.outputs.mode }}

      - name: Nepali typing functional checks
        id: nepali
        if: always() && (steps.mode.outputs.mode == 'weekly' || steps.mode.outputs.mode == 'all')
        run: node scripts/test-nepali-typing.mjs

      - name: Preeti conversion and device language checks
        id: preeti
        if: always() && (steps.mode.outputs.mode == 'weekly' || steps.mode.outputs.mode == 'all')
        run: node scripts/test-preeti-and-language.mjs

      - name: Search crawler accessibility checks
        id: discovery
        if: always() && (steps.mode.outputs.mode == 'weekly' || steps.mode.outputs.mode == 'all')
        run: node scripts/check-discovery.mjs

      - name: Simple calculator functional checks
        id: calculator
        if: always() && (steps.mode.outputs.mode == 'weekly' || steps.mode.outputs.mode == 'all')
        env:
          KALIKA_TEST_ORIGIN: https://kalikatools.com
        run: node scripts/test-simple-calculator.mjs

      - name: PDF tools functional checks
        id: pdf
        if: always() && (steps.mode.outputs.mode == 'weekly' || steps.mode.outputs.mode == 'all')
        env:
          KALIKA_TEST_ORIGIN: https://kalikatools.com
        run: node scripts/test-pdf-tools.mjs

      - name: Scientific fraction and work hours checks
        id: calculators
        if: always() && (steps.mode.outputs.mode == 'weekly' || steps.mode.outputs.mode == 'all')
        env:
          KALIKA_TEST_ORIGIN: https://kalikatools.com
        run: node scripts/test-calculator-tools.mjs

      - name: Competitor SEO review
        id: competitors
        if: always() && (steps.mode.outputs.mode == 'weekly' || steps.mode.outputs.mode == 'all')
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
        run: node scripts/competitor-seo.mjs

      - name: Readable report summary
        if: always()
        run: |
          if [ -f reports/latest.md ]; then cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f reports/competitor-seo.md ]; then cat reports/competitor-seo.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Send weekly report email
        if: always() && (steps.mode.outputs.mode == 'weekly' || steps.mode.outputs.mode == 'all')
        env:
          KALIKA_REPORT_TO: ${{ secrets.KALIKA_REPORT_TO || vars.KALIKA_REPORT_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER || vars.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          KALIKA_CHECK_RESULTS: ${{ toJSON(steps) }}
        run: npm run email:weekly-report

      - name: Save reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kalika-reports-${{ github.run_id }}
          path: reports/
          retention-days: 90

      - name: Mark workflow failed when urgent issues were found
        if: steps.run_checks.outcome == 'failure'
        run: exit 1
