name: Security audit
on:
  push:
  pull_request:
  schedule:
    - cron: '23 5 * * 2'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run check:security
      - name: Scan Git history for credentials (redacted)
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --log-opts="--all" --no-banner
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-analytics.mjs
      - run: node scripts/test-security-inputs.mjs
      - run: node scripts/test-security-admin.mjs
      - run: node scripts/test-web-admin.mjs
      - run: node scripts/test-report-auth.mjs
      - name: Private OCR browser regression
        run: node scripts/test-ocr.mjs

      - name: Category navigation and search regression
        run: node scripts/test-category-hubs.mjs

      - name: Homepage task search regression
        run: node scripts/test-home-search.mjs
