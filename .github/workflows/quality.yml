name: Site quality checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run check:security
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-quality-engine.mjs
      - name: Read-only accessibility and mobile Lighthouse checks
        run: npm run check:quality
      - name: Readable quality summary
        if: always()
        run: |
          if [ -f reports/quality.md ]; then cat reports/quality.md >> "$GITHUB_STEP_SUMMARY"; else echo 'Quality report missing; checks did not complete.' >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: kalika-quality-${{ github.run_id }}
          path: |
            reports/quality.md
            reports/quality/
          retention-days: 30
